<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f19" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="google-site-verification" content="google518921bf2d03f72d" />
    <title>CSV Auditor Pro</title>
    <meta name="description" content="An AI-powered SaaS platform that helps businesses upload, analyze, clean, validate, and audit CSV files." />
    <meta property="og:title" content="CSV Auditor Pro" />
    <meta property="og:description" content="An AI-powered SaaS platform that helps businesses upload, analyze, clean, validate, and audit CSV files." />
    <script>
      if (typeof window !== 'undefined') {
        window.process = window.process || { env: {} };
        if (!window.process.env) {
          window.process.env = {};
        }
        if (typeof window.process.cwd !== 'function') {
          window.process.cwd = function() { return '/'; };
        }
        var pathPoly = {
          resolve: function() { return Array.prototype.slice.call(arguments).filter(Boolean).join('/').replace(/\/+/g, '/'); },
          join: function() { return Array.prototype.slice.call(arguments).filter(Boolean).join('/').replace(/\/+/g, '/'); },
          dirname: function(p) { return (p || '').split('/').slice(0, -1).join('/') || '/'; },
          basename: function(p, ext) {
            var b = (p || '').split('/').pop() || '';
            if (ext && b.endsWith(ext)) return b.slice(0, -ext.length);
            return b;
          },
          extname: function(p) {
            var b = (p || '').split('/').pop() || '';
            var idx = b.lastIndexOf('.');
            return idx > 0 ? b.slice(idx) : '';
          },
          normalize: function(p) { return p; },
          isAbsolute: function(p) { return (p || '').startsWith('/'); },
          relative: function(from, to) { return to; },
          sep: '/',
          delimiter: ':'
        };
        window.path = window.path || pathPoly;
        if (typeof globalThis !== 'undefined') {
          globalThis.path = globalThis.path || pathPoly;
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
